<style>
  :root{
    --tinta:#1a1a2e; --papel:#ffffff; --crema:#fdf8f0;
    --teal:#0f7b6c; --teal-osc:#0b5e52; --teal-claro:#d0ede9;
    --borde:#cdd5d3; --verde:#1b5e20; --verde-bg:#e8f5e9;
    --rojo:#c0392b; --rojo-bg:#fdecea; --ambar-bg:#fff8e1;
    --marron:#5C3900; --muted:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--crema);color:var(--tinta);line-height:1.55;padding:24px 14px 48px;}
  .ejercicio{max-width:760px;margin:0 auto;background:var(--papel);border:1px solid var(--borde);border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(26,26,46,0.08);}
  .ej-header{background:var(--teal);color:#fff;padding:22px 24px;}
  .ej-header h1{font-size:1.45rem;font-weight:800;line-height:1.3;}
  .ej-figura{margin:0;padding:18px 24px 4px;text-align:center;}
  .ej-figura img{max-width:100%;height:auto;border:1px solid var(--borde);border-radius:8px;}
  .marcador{margin:14px 24px;padding:10px 16px;background:var(--teal-claro);border-radius:8px;font-size:0.95rem;color:var(--teal-osc);font-weight:600;}
  #contenedor{padding:0 24px;}
  .pregunta{border:1px solid var(--borde);border-radius:12px;padding:18px;margin-bottom:18px;}
  .p-titulo{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.05rem;color:var(--teal-osc);margin-bottom:10px;}
  .p-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--teal);color:#fff;border-radius:7px;font-size:0.9rem;font-weight:800;flex-shrink:0;}
  .p-tag{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;background:var(--teal-claro);color:var(--teal-osc);border:1px solid var(--teal);padding:2px 8px;border-radius:5px;}
  .p-enunciado{font-size:1rem;font-weight:600;margin-bottom:12px;}
  .opciones{display:grid;gap:8px;}
  .opcion{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;background:var(--crema);border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;font-size:0.95rem;font-family:inherit;color:var(--tinta);cursor:pointer;transition:all .18s;}
  .opcion:hover:not(:disabled){border-color:var(--teal);background:var(--teal-claro);}
  .opcion:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .op-letra{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid var(--borde);font-weight:800;font-size:0.8rem;flex-shrink:0;}
  .op-texto{flex:1;}
  .opcion.sel{border-color:var(--teal);background:var(--teal-claro);}
  .opcion.sel .op-letra{background:var(--teal);color:#fff;border-color:var(--teal);}
  .opcion.correcta{border-color:var(--verde);background:var(--verde-bg);color:var(--verde);font-weight:600;}
  .opcion.correcta .op-letra{background:var(--verde);color:#fff;border-color:var(--verde);}
  .opcion.incorrecta{border-color:var(--rojo);background:var(--rojo-bg);color:var(--rojo);}
  .opcion.incorrecta .op-letra{background:var(--rojo);color:#fff;border-color:var(--rojo);}
  .opcion:disabled{cursor:default;}
  .p-acciones{margin-top:12px;}
  .btn-comprobar{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:0.92rem;font-weight:700;font-family:inherit;cursor:pointer;transition:background .18s;}
  .btn-comprobar:hover:not(:disabled){background:var(--teal-osc);}
  .btn-comprobar:focus-visible{outline:3px solid var(--marron);outline-offset:2px;}
  .btn-comprobar:disabled{background:#b8c4c1;color:#37423f;cursor:not-allowed;}
  .feedback{margin-top:12px;padding:11px 14px;border-radius:8px;font-size:0.92rem;line-height:1.55;}
  .fb-ok{background:var(--verde-bg);border:1px solid var(--verde);color:var(--verde);}
  .fb-no{background:var(--ambar-bg);border:1px solid var(--marron);color:var(--marron);}
  .acciones-globales{padding:6px 24px 4px;}
  .btn-reiniciar{background:#fff;color:var(--teal-osc);border:1.5px solid var(--teal);border-radius:8px;padding:8px 16px;font-size:0.88rem;font-weight:700;font-family:inherit;cursor:pointer;}
  .btn-reiniciar:hover{background:var(--teal-claro);}
  .btn-reiniciar:focus-visible{outline:3px solid var(--marron);outline-offset:2px;}
  .ej-footer{margin-top:18px;padding:18px 24px;border-top:1px solid var(--borde);font-size:0.8rem;color:var(--muted);text-align:center;}
  .ej-footer a{color:var(--teal-osc);}
  @media(max-width:520px){.ej-header h1{font-size:1.2rem;}.opcion{font-size:0.9rem;}}
</style>
</head>
<body>
<main class="ejercicio">
  <header class="ej-header"><h1>Mapa de lugares turísticos de España</h1></header>
  <figure class="ej-figura"><img src="https://us.123rf.com/450wm/victory1103/victory11031806/victory1103180600055/103822437-vector-map-of-spain-with-landmarks-people-food-and-plants-travel-map.jpg" alt="Mapa de lugares turísticos de España"></figure>
  <div class="marcador" role="status" aria-live="polite">Aciertos: <strong id="aciertos">0</strong> de <strong id="total">0</strong></div>
  <div id="contenedor"></div>
  <div class="acciones-globales"><button type="button" class="btn-reiniciar" id="btnReiniciar">&#8635; Reiniciar ejercicio</button></div>
  <footer class="ej-footer">
    <p>&copy; <span id="anio"></span> José M. Fernández — Adult Education Program · Harry S. Truman College · GEDparaHispanos.com</p>
    <p><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" target="_blank" rel="noopener">Licencia CC BY-NC-SA 4.0</a></p>
  </footer>
</main>
<script>
(function(){
  "use strict";
  var PREGUNTAS = [{"pregunta":"¿Qué país representa este mapa ilustrado?","tipo":"dato_especifico","opciones":["Italia","España","Portugal","Francia"],"correcta":1,"feedback":"La palabra 'Spain' aparece escrita en grandes letras rojas en la esquina inferior derecha, y se muestran ciudades como Madrid, Barcelona y Sevilla, que son españolas."},{"pregunta":"El toro ilustrado cerca de Valencia y en el centro-este del mapa simboliza:","tipo":"simbolismo","opciones":["La industria ganadera moderna","Un animal en peligro de extinción","Una tradición cultural típica de España, como las corridas de toros","La agricultura del país"],"correcta":2,"feedback":"El toro es un símbolo cultural profundamente asociado con España y sus tradiciones como las corridas de toros, por eso el artista lo incluye como ícono representativo del país."},{"pregunta":"La figura de una mujer vestida con traje rojo y en pose de baile cerca de Sevilla representa:","tipo":"interpretacion","opciones":["El baile flamenco, tradición del sur de España","Una vestimenta de trabajo agrícola","Un uniforme militar","Ropa típica de invierno"],"correcta":0,"feedback":"La mujer con vestido rojo en pose de baile representa el flamenco, danza tradicional asociada a Andalucía y la región de Sevilla, mostrada precisamente en esa zona del mapa."},{"pregunta":"¿Por qué el artista colocó ilustraciones de guitarra, vino, uvas y una paella en diferentes regiones del mapa?","tipo":"inferencia","opciones":["Para indicar dónde comprar productos baratos","Para representar elementos culturales y gastronómicos característicos de cada región","Para señalar zonas prohibidas para turistas","Para mostrar rutas de transporte"],"correcta":1,"feedback":"Cada ícono está ubicado en la región donde ese elemento es representativo (la guitarra, el vino, las uvas y la paella), sugiriendo las especialidades culturales y gastronómicas típicas de cada zona."},{"pregunta":"La presencia de líneas onduladas de color más oscuro alrededor de la forma central del mapa simboliza:","tipo":"simbolismo","opciones":["Montañas que rodean el país","El mar y las aguas que rodean la península","Fronteras políticas con otros países","Carreteras principales"],"correcta":1,"feedback":"Las líneas onduladas representan el agua del mar Mediterráneo y el océano Atlántico que rodean la península ibérica, un recurso visual común para indicar zonas marítimas en los mapas ilustrados."}];
  var TIPOS = {
    interpretacion:'Interpretación', inferencia:'Inferencia',
    causa_efecto:'Causa-efecto', simbolismo:'Simbolismo',
    punto_de_vista:'Punto de vista', dato_especifico:'Dato específico'
  };
  var cont = document.getElementById('contenedor');
  var totalEl = document.getElementById('total');
  var aciertosEl = document.getElementById('aciertos');
  var estado = [];
  function letra(i){ return String.fromCharCode(65 + i); }
  function actualizarMarcador(){
    var n = 0, i;
    for(i = 0; i < estado.length; i++){ if(estado[i].acertada){ n++; } }
    aciertosEl.textContent = n;
  }
  function seleccionar(i, j){
    if(estado[i].comprobada){ return; }
    estado[i].sel = j;
    var sec = cont.children[i];
    var botones = sec.querySelectorAll('.opcion');
    for(var k = 0; k < botones.length; k++){
      var on = (k === j);
      botones[k].classList.toggle('sel', on);
      botones[k].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    sec.querySelector('.btn-comprobar').disabled = false;
  }
  function comprobar(i){
    var st = estado[i];
    if(st.comprobada || st.sel === null){ return; }
    st.comprobada = true;
    var correcta = parseInt(PREGUNTAS[i].correcta, 10);
    st.acertada = (st.sel === correcta);
    var sec = cont.children[i];
    var botones = sec.querySelectorAll('.opcion');
    for(var k = 0; k < botones.length; k++){
      botones[k].disabled = true;
      botones[k].classList.remove('sel');
      if(k === correcta){ botones[k].classList.add('correcta'); }
      else if(k === st.sel){ botones[k].classList.add('incorrecta'); }
    }
    sec.querySelector('.btn-comprobar').disabled = true;
    var fb = sec.querySelector('.feedback');
    fb.className = 'feedback ' + (st.acertada ? 'fb-ok' : 'fb-no');
    fb.hidden = false;
    fb.innerHTML = '';
    var lead = document.createElement('strong');
    lead.textContent = st.acertada ? '¡Correcto! ' : 'Respuesta incorrecta. ';
    fb.appendChild(lead);
    if(!st.acertada){
      var corr = document.createElement('span');
      corr.textContent = 'La opción correcta es la ' + letra(correcta) + '. ';
      fb.appendChild(corr);
    }
    if(PREGUNTAS[i].feedback){
      fb.appendChild(document.createTextNode(PREGUNTAS[i].feedback));
    }
    actualizarMarcador();
  }
  function construir(){
    cont.innerHTML = '';
    totalEl.textContent = PREGUNTAS.length;
    estado = [];
    PREGUNTAS.forEach(function(q, i){
      estado.push({ sel:null, comprobada:false, acertada:false });
      var sec = document.createElement('section');
      sec.className = 'pregunta';
      sec.setAttribute('aria-labelledby', 'p' + i + '-titulo');
      var h2 = document.createElement('h2');
      h2.id = 'p' + i + '-titulo';
      h2.className = 'p-titulo';
      var num = document.createElement('span');
      num.className = 'p-num';
      num.setAttribute('aria-hidden', 'true');
      num.textContent = (i + 1);
      h2.appendChild(num);
      h2.appendChild(document.createTextNode(' Pregunta ' + (i + 1)));
      if(q.tipo && TIPOS[q.tipo]){
        var tag = document.createElement('span');
        tag.className = 'p-tag';
        tag.textContent = TIPOS[q.tipo];
        h2.appendChild(tag);
      }
      sec.appendChild(h2);
      var enun = document.createElement('p');
      enun.className = 'p-enunciado';
      enun.textContent = q.pregunta || '';
      sec.appendChild(enun);
      var grupo = document.createElement('div');
      grupo.className = 'opciones';
      grupo.setAttribute('role', 'group');
      grupo.setAttribute('aria-label', 'Opciones de respuesta para la pregunta ' + (i + 1));
      (q.opciones || []).forEach(function(opt, j){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opcion';
        b.setAttribute('aria-pressed', 'false');
        var l = document.createElement('span');
        l.className = 'op-letra';
        l.setAttribute('aria-hidden', 'true');
        l.textContent = letra(j);
        b.appendChild(l);
        var t = document.createElement('span');
        t.className = 'op-texto';
        t.textContent = opt;
        b.appendChild(t);
        b.addEventListener('click', function(){ seleccionar(i, j); });
        grupo.appendChild(b);
      });
      sec.appendChild(grupo);
      var acc = document.createElement('div');
      acc.className = 'p-acciones';
      var bc = document.createElement('button');
      bc.type = 'button';
      bc.className = 'btn-comprobar';
      bc.textContent = 'Comprobar respuesta';
      bc.disabled = true;
      bc.addEventListener('click', function(){ comprobar(i); });
      acc.appendChild(bc);
      sec.appendChild(acc);
      var fb = document.createElement('div');
      fb.className = 'feedback';
      fb.hidden = true;
      sec.appendChild(fb);
      cont.appendChild(sec);
    });
    actualizarMarcador();
  }
  var btnR = document.getElementById('btnReiniciar');
  if(btnR){ btnR.addEventListener('click', construir); }
  var anio = document.getElementById('anio');
  if(anio){ anio.textContent = new Date().getFullYear(); }
  construir();
})();
</script>
</body>
</html>
